    <line x1="340" y1="62" x2="340" y2="202"></line>
    <line x1="405" y1="62" x2="405" y2="202"></line>
    <line x1="210" y1="97" x2="470" y2="97"></line>
    <line x1="210" y1="132" x2="470" y2="132"></line>
    <line x1="210" y1="167" x2="470" y2="167"></line>
  </g>

  <g fill="none" stroke="#39ff6a" stroke-linecap="round" stroke-linejoin="round">
