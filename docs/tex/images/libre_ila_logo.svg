<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="182 36 316 272" width="316" height="272" role="img">
  <title>LibreILA logo</title>
  <desc>A retro oscilloscope-style logo: a CRT device showing two digital waveform traces under one amber trigger marker. The top trace is a clean green digital signal; the bottom trace ends in a red pentagon marking an undefined logic value. The wordmark LibreILA appears below in monospace phosphor green.</desc>
  <defs>
    <linearGradient id="bezelGrad" x1="0" y1="44" x2="0" y2="246" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2b302b"></stop>
      <stop offset="1" stop-color="#14171a"></stop>
    </linearGradient>
  </defs>

  <rect x="190" y="44" width="300" height="202" rx="18" fill="url(#bezelGrad)" stroke="#3a3f3a" stroke-width="1"></rect>
  <rect x="210" y="62" width="260" height="140" rx="8" fill="#050a06" stroke="#163a20" stroke-width="1"></rect>

  <g stroke="#164024" stroke-width="0.5" opacity="0.4">
