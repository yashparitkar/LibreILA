    <path d="M224,127 L250,127 L250,92 L285,92 L285,127 L310,127 L310,92 L350,92 L350,127 L380,127 L380,92 L420,92 L420,127 L452,127" stroke-width="6" opacity="0.14"></path>
    <path d="M224,127 L250,127 L250,92 L285,92 L285,127 L310,127 L310,92 L350,92 L350,127 L380,127 L380,92 L420,92 L420,127 L452,127" stroke-width="3.5" opacity="0.3"></path>
    <path d="M224,127 L250,127 L250,92 L285,92 L285,127 L310,127 L310,92 L350,92 L350,127 L380,127 L380,92 L420,92 L420,127 L452,127" stroke-width="1.6"></path>
  </g>

